<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tanjung Arus — Open-World Port City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d2733; font-family: system-ui, "Segoe UI", sans-serif; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: rgba(10,25,35,.72); color: #eef6f8; border-radius: 10px; padding: 10px 14px; }
  /* GTA-style HUD: stars + money + health, top-right. */
  #stats { position: absolute; top: 14px; right: 14px; text-align: right; width: fit-content; }
  #stars { font-size: 30px; letter-spacing: 3px; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  #stars .dim { color: #46525e; }
  #stars.flash { animation: starflash .18s linear infinite alternate; }
  @keyframes starflash { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.12); filter: brightness(1.7); } }
  #money { font-size: 26px; font-weight: 800; color: #37d67a; text-shadow: 0 2px 4px rgba(0,0,0,.65); margin: 2px 0 6px; }
  #healthbar { height: 7px; width: 150px; margin-left: auto; background: #3a4750; border-radius: 4px; overflow: hidden; }
  #healthfill { height: 100%; width: 100%; background: #2ecc71; transition: width .2s; }
  /* Round minimap, bottom-left, district label beneath it. */
  #mapwrap { position: absolute; left: 14px; bottom: 14px; text-align: center; }
  #minimap { display: block; border-radius: 50%; border: 4px solid #10181f; box-shadow: 0 2px 14px rgba(0,0,0,.55); background: #3f7a44; }
  #district { margin-top: 5px; font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px #000; }
  #objective { top: 14px; left: 50%; transform: translateX(-50%); max-width: 520px; text-align: center; font-size: 15px; }
  #dialogue { bottom: 108px; left: 50%; transform: translateX(-50%); max-width: 560px; background: rgba(60,40,8,.85); font-style: italic; }
  #speed { right: 14px; bottom: 14px; font-size: 17px; font-weight: 600; }
  #notify { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); background: rgba(20,90,50,.9); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 16px; opacity: 0; transition: opacity .4s; }
  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.75); font-size: 12px; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  /* Touch controls: analogue stick bottom-left, stacked buttons bottom-right. */
  #touch-ui { position: fixed; inset: 0; pointer-events: none; touch-action: none; z-index: 5; }
  #joy-base { position: absolute; left: 22px; bottom: 120px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; touch-action: none; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.45); border: 2px solid rgba(255,255,255,.6); transform: translate(-50%, -50%); }
  #touch-btns { position: absolute; right: 16px; bottom: 110px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  #touch-btns button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(10,25,35,.55); color: #fff; font-size: 12px; font-weight: 700; pointer-events: auto; touch-action: none; }
  #touch-btns button:active { background: rgba(255,217,77,.7); color: #20303a; }
  #btn-t-pause { position: fixed; top: 96px; right: 14px; z-index: 10; width: 48px !important; height: 48px !important; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; background: linear-gradient(180deg, rgba(13,60,90,.88), rgba(8,35,30,.92)); pointer-events: auto; padding: 20px; }
  .screen h1 { font-size: 54px; margin: 0 0 8px; letter-spacing: 3px; color: #ffd94d; text-shadow: 0 3px 0 #b3541e; }
  .screen .sub { font-size: 19px; margin: 0 0 10px; }
  .screen .story { max-width: 560px; line-height: 1.5; opacity: .9; }
  .screen button { pointer-events: auto; margin-top: 14px; font-size: 19px; padding: 12px 34px; border: 0; border-radius: 10px; background: #ffd94d; color: #20303a; font-weight: 700; cursor: pointer; }
  .screen button:hover { background: #ffe27a; }
  .screen .keys { margin-top: 18px; font-size: 13px; opacity: .75; }
  @media (max-width: 700px) {
    .screen h1 { font-size: 36px; }
    #objective { max-width: 92vw; font-size: 13px; top: 8px; }
    #stats { top: 8px; right: 8px; min-width: 140px; }
    #stars { font-size: 22px; }
    #money { font-size: 20px; }
    #mapwrap { left: 8px; bottom: 8px; }
    #minimap { width: 116px; height: 116px; box-sizing: border-box; }
    #joy-base { left: 130px; bottom: 20px; }
    #speed { bottom: 300px; right: 10px; font-size: 14px; }
    #dialogue { bottom: 300px; max-width: 92vw; }
    #hint { display: none; }
  }
  @media (max-height: 500px) {
    #mapwrap { left: 8px; bottom: 8px; }
    #minimap { width: 104px; height: 104px; box-sizing: border-box; }
    #joy-base { left: 118px; bottom: 14px; }
  }
  @media (max-width: 640px) {
    #objective { max-width: 56vw; font-size: 13px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Tanjung Arus: open-world port city game"></canvas>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
